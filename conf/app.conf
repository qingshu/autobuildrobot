appname = buildRobot
httpport = 31416
runmode = dev
copyrequestbody = true
#一条构建消息的行数
lineInOneMes = 200
#window git 安装路径，用于执行shell脚本
winGitPath = "F:/Software/Git/bin/sh.exe"
#svn日志过滤字符串
logFilter = "Merge|MERGE|merge|忽略@"
#超级用户，一定具有用户管理权限
superUser = ""
#钉钉机器人验证密钥
dingdingRobotAppSecret = ""
#定时关闭机器人时间（每天从0点算起得秒数，如果-1则表示不定时关闭）
closeRobotTime = 3580
#svn机器地址账号密码
svnMachineAddr = ""
svnMachineAccount = ""
svnMachinePwd     = ""

#工作协程数
worksCount = 3
#共享通道“长”度
workChanLen = 10
